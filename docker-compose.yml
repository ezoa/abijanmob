# Démo AbidjanMob — lancement complet en une commande :
#   docker compose up --build        (ou : make up)
#   → Interface : http://localhost:8080   · API : http://localhost:8000/docs
#                 Analytics décideurs : http://localhost:3000 (Metabase)
#
# Configuration : les identifiants et ports sont centralisés dans `.env`
# (voir .env.example). Les valeurs ci-dessous ne sont que des replis par défaut.
#
# Services :
#   api        — FastAPI (moteur d'itinéraires, paiements simulés, flotte en
#                direct, module financier) ; écrit dans PostgreSQL (best-effort)
#   nginx      — point d'entrée web : sert le frontend construit + proxifie /api
#                (étape finale de demo/frontend/Dockerfile : image nginx:1.27-alpine)
#   db         — PostgreSQL 16 : analytics décideurs + finance
#   db-init    — one-shot : génère 14 jours de données (idempotent)
#   metabase   — tableaux de bord décideurs (:3000) branchés sur PostgreSQL
#   tiles-init — one-shot : récupère les tuiles OSM manquantes (idempotent)
# NB : utiliser docker OU demo/demo.sh, pas les deux en même temps (port API).
services:
  api:
    build:
      context: .
      dockerfile: demo/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-abidjanmob}:${POSTGRES_PASSWORD:-abidjanmob}@db:5432/${POSTGRES_DB:-abidjanmob}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: demo/frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./demo/frontend/public/tiles:/usr/share/nginx/html/tiles
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abidjanmob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abidjanmob}
      POSTGRES_DB: ${POSTGRES_DB:-abidjanmob}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-init:
    image: python:3.12-slim
    volumes:
      - ./demo/backend/seed_analytics.py:/seed_analytics.py:ro
      - ./data/corpus/network.json:/network.json:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-abidjanmob}:${POSTGRES_PASSWORD:-abidjanmob}@db:5432/${POSTGRES_DB:-abidjanmob}
      CORPUS_PATH: /network.json
    command: sh -c "pip install -q psycopg[binary] && python /seed_analytics.py"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  metabase:
    image: metabase/metabase:latest
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tiles-init:
    image: python:3.12-alpine
    volumes:
      - ./demo/frontend/scripts/fetch_tiles.py:/fetch_tiles.py:ro
      - ./demo/frontend/public/tiles:/tiles
    environment:
      TILES_DIR: /tiles
    command: python /fetch_tiles.py
    restart: "no"

volumes:
  pgdata:
  metabase-data:
